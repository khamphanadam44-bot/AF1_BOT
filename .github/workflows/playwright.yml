name: Playwright Tests

on:
  push:
    branches:
      - main
      - master
      - dev

  pull_request:
    branches:
      - main
      - master
      - dev

jobs:
  test:
    timeout-minutes: 15
    runs-on: ubuntu-latest

    steps:
      # ดาวน์โหลด Source Code ของ Branch หรือ Pull Request
      - name: Checkout source code
        uses: actions/checkout@v4

      # ติดตั้ง Node.js ให้ GitHub Actions
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # ติดตั้ง Package ตาม package-lock.json
      - name: Install dependencies
        run: npm ci

      # ตรวจสอบ TypeScript โดยไม่สร้างไฟล์ JavaScript
      # หาก Import ผิด, Type ผิด หรือหาไฟล์ไม่เจอ ขั้นตอนนี้จะ FAIL
      - name: Check TypeScript
        run: npx tsc --noEmit